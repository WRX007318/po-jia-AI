name: PA-003 probe and worker tests

on:
  push:
    branches:
      - main
      - feat/pa-001-local-workbench
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/pa003-probe-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/pa003-probe-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and probe modules
        run: python -m compileall -q app tests
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
